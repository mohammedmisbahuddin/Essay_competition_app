[phases.setup]
nixPkgs = ["nodejs", "npm"]

[phases.install]
cmds = [
  "npm install",
  "cd backend && npm install --production=false"
]

[phases.build]
cmds = [
  "echo 'Backend-only deployment - skipping frontend build'"
]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
PORT = "5001"
